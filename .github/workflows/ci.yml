name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=results.trx"
      - name: Report test count
        if: always()
        run: |
          total=$(grep -o 'total="[0-9]*"' artifacts/**/results.trx 2>/dev/null | head -1 || true)
          echo "trx counters: ${total:-not found}"

  blueprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/blueprint/package-lock.json
      - run: npm ci
        working-directory: tools/blueprint
      - name: Validate status.json and build the Blueprint page
        run: npm run build
        working-directory: tools/blueprint

  lint-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"

  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress "**/*.md"
          failIfEmpty: false # a docs set with no links is valid, not a misconfiguration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-mermaid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Render every mermaid diagram (fails on invalid syntax)
        run: |
          set -e
          echo '{"args":["--no-sandbox","--disable-setuid-sandbox"]}' > /tmp/puppeteer-config.json
          shopt -s globstar nullglob
          status=0
          for f in **/*.md; do
            if grep -q '```mermaid' "$f"; then
              echo "Validating mermaid in $f"
              npx -y @mermaid-js/mermaid-cli -i "$f" -o /tmp/mermaid-out.svg -p /tmp/puppeteer-config.json || status=1
            fi
          done
          exit $status
