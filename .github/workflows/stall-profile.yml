name: stall-profile

# Samples stacks of the storyteller bench while raid runs slow down, so the stall is found off the dev PC.
on:
  push:
    branches: [ci/stall-profile]

permissions:
  contents: read

concurrency:
  group: stall-profile
  cancel-in-progress: true

jobs:
  profile:
    strategy:
      fail-fast: false
      matrix:
        run: ["20:101", "20:106", "20:99"]
    name: profile ${{ matrix.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { ref: aca7e5e68909731b55799dbfb17f0f0784855053 }
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - run: dotnet build tools/bench/SimWorld.Bench -c Release
      - name: Run and count
        env:
          RUN: ${{ matrix.run }}
        run: |
          mkdir out
          DLL=$(find artifacts -path '*SimWorld.Bench*' -name SimWorld.Bench.dll | grep -i release | grep -v '/obj/' | head -1)
          dotnet "$DLL" --suite storyteller --solo false --days 60 --threats true --band "${RUN%%:*}" --seed "${RUN##*:}" > out/bench.txt 2> out/count.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "prof-${{ strategy.job-index }}", path: out }
